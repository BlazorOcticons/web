      window.clipboardCopy = {
        copyText: function (text) {
          navigator.clipboard.writeText(text).then(function () { }).catch(function (error) { console.log(error); });
        }
      }
      // The browser's own fragment scroll runs before Blazor renders the target.
      window.scrollToHash = function () {
        const element = location.hash && document.getElementById(location.hash.slice(1));
        if (element) {
          element.scrollIntoView({ behavior: 'instant' });
        }
      }
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
      // Boot after the static content paints, so WebAssembly startup can't delay first paint.
      var blazorStarted = false;
      function startBlazor() {
        if (!blazorStarted) {
          blazorStarted = true;
          Blazor.start();
        }
      }
      if (window.PerformanceObserver && PerformanceObserver.supportedEntryTypes.includes('paint')) {
        new PerformanceObserver(function (list) {
          if (list.getEntriesByName('first-contentful-paint').length) {
            startBlazor();
          }
        }).observe({ type: 'paint', buffered: true });
      }
      setTimeout(startBlazor, 1000);
    </script>
